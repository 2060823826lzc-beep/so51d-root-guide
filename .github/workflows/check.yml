name: Toolbox offline checks
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: pip install pyinstaller==6.22.0
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SO51D-Root-Tool --icon gui/app.ico gui/app.py
      # Hosted Windows runners do not provide a reliable interactive desktop.
      # Full widget geometry self-test runs locally in build_release.py.
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-gui-for-offline-checks
          path: dist/SO51D-Root-Tool.exe
